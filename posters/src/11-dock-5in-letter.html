<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Drone dock — Five Inch — 8.5×11</title>
<style>
@font-face{font-family:'Barlow';font-weight:500;src:url(fonts/barlow-500.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;src:url(fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Cabin Sketch';font-weight:700;src:url(fonts/cabin-sketch-700.woff2) format('woff2')}
@font-face{font-family:'Share Tech Mono';font-weight:400;src:url(fonts/share-tech-mono-400.woff2) format('woff2')}
@font-face{font-family:'Architects Daughter';font-weight:400;src:url(fonts/architects-daughter-400.woff2) format('woff2')}
@page{size:8.5in 11in;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:816px;height:1056px;overflow:hidden}
body{background:#fff;color:#1f3350;font-family:'Barlow',sans-serif;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.grid{position:absolute;inset:0;opacity:.22;background-image:linear-gradient(rgba(31,51,80,.42) 1px,transparent 1px),linear-gradient(90deg,rgba(31,51,80,.42) 1px,transparent 1px);background-size:28px 28px}
.sheet{position:relative;width:100%;height:100%;padding:43px}
.top{height:221px;display:flex;flex-direction:column;gap:7px;border-bottom:2px solid #1f3350;padding-bottom:10px;margin-bottom:8px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:'Cabin Sketch',cursive;font-weight:700;font-size:40px;line-height:.9}
h1 small{display:block;font-family:'Share Tech Mono',monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:#546881;margin-top:6px}
.tag{font-family:'Share Tech Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#8f3d12;border:2px solid #8f3d12;padding:6px 10px;text-align:center;line-height:1.3;transform:rotate(-3deg);white-space:nowrap}
.tag b{display:block;font-size:13px;letter-spacing:.26em}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.name{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid #1f3350;padding-bottom:3px;min-height:34px}
.name span{font-family:'Share Tech Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#546881;white-space:nowrap}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1.5px solid #1f3350;flex:1;min-height:64px}
.cell{border-right:1px solid rgba(31,51,80,.42);border-bottom:1px solid rgba(31,51,80,.42);padding:4px 6px;min-height:28px}
.cell:nth-child(4n){border-right:0}
.cell:nth-child(n+5){border-bottom:0}
.cell span{font-family:'Share Tech Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#546881}
.how{font-family:'Architects Daughter',cursive;font-size:13px;white-space:nowrap;overflow:hidden;color:#8f3d12;line-height:1.25}
.how b{color:#1f3350;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.16em;font-weight:400}
.drone{position:absolute;left:43px;right:43px;top:264px;bottom:43px}
.drone svg{width:100%;height:100%}
</style></head>
<body>
<div class="grid"></div>
<div class="sheet">
  <div class="top">
    <div class="head">
      <h1>DRONE DOCK<small>5-inch freestyle · 225 mm · Tier 2</small></h1>
      <div class="tag"><b>FIVE INCH</b>Brophy FPV Club</div>
    </div>
    <div class="names">
      <div class="name"><span>Pilot</span></div>
      <div class="name"><span>Drone</span></div>
    </div>
    <div class="specs"><div class="cell"><span>Frame</span></div><div class="cell"><span>Motors (KV)</span></div><div class="cell"><span>Battery (4S / 6S)</span></div><div class="cell"><span>FC / ESC</span></div><div class="cell"><span>Camera / VTX</span></div><div class="cell"><span>Receiver</span></div><div class="cell"><span>Weight</span></div><div class="cell"><span>Props</span></div></div>
    <div class="how"><b>HOW</b> &nbsp;Pin the sheet up &middot; pins through the <span style="color:#8f3d12">&oplus;</span> marks &middot; hang the drone by its arms, props off or facing out &middot; front is up.</div>
  </div>
  <div class="drone"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 193.0 198.1" width="7.60in" height="7.80in" style="display:block;overflow:visible">

<g clip-path="url(#page)" fill="none" stroke="#1f3350" stroke-linecap="round" stroke-linejoin="round">

<line x1="96.5" y1="99.1" x2="17.0" y2="178.6" stroke-width="4.0"/>
<line x1="96.5" y1="99.1" x2="176.1" y2="178.6" stroke-width="4.0"/>
<circle cx="17.0" cy="19.5" r="63.5" stroke-width=".9" stroke-dasharray="3 3" stroke="#546881"/>
<circle cx="176.1" cy="19.5" r="63.5" stroke-width=".9" stroke-dasharray="3 3" stroke="#546881"/>
<circle cx="17.0" cy="178.6" r="63.5" stroke-width=".9" stroke-dasharray="3 3" stroke="#546881"/>
<circle cx="176.1" cy="178.6" r="63.5" stroke-width=".9" stroke-dasharray="3 3" stroke="#546881"/>
<rect x="76.5" y="44.1" width="40.0" height="110.0" rx="7.2" stroke-width="1.8" fill="#ffffff"/>
<path d="M85.3 59.5 l11.2 -11.0 h11.2 z" stroke-width="1.2"/>
<line x1="76.5" y1="118.9" x2="116.5" y2="118.9" stroke-width=".9" stroke-dasharray="2 2"/>
<line x1="76.5" y1="138.7" x2="116.5" y2="138.7" stroke-width=".9" stroke-dasharray="2 2"/>
<circle cx="17.0" cy="19.5" r="14.0" stroke-width="1.6" fill="rgba(255,255,255,.9)"/>
<g stroke="#8f3d12" stroke-width="1"><circle cx="17.0" cy="19.5" r="2.6"/><line x1="12.5" y1="19.5" x2="21.5" y2="19.5"/><line x1="17.0" y1="15.0" x2="17.0" y2="24.0"/></g>
<circle cx="176.1" cy="19.5" r="14.0" stroke-width="1.6" fill="rgba(255,255,255,.9)"/>
<g stroke="#8f3d12" stroke-width="1"><circle cx="176.1" cy="19.5" r="2.6"/><line x1="171.6" y1="19.5" x2="180.6" y2="19.5"/><line x1="176.1" y1="15.0" x2="176.1" y2="24.0"/></g>
<circle cx="17.0" cy="178.6" r="14.0" stroke-width="1.6" fill="rgba(255,255,255,.9)"/>
<g stroke="#8f3d12" stroke-width="1"><circle cx="17.0" cy="178.6" r="2.6"/><line x1="12.5" y1="178.6" x2="21.5" y2="178.6"/><line x1="17.0" y1="174.1" x2="17.0" y2="183.1"/></g>
<circle cx="176.1" cy="178.6" r="14.0" stroke-width="1.6" fill="rgba(255,255,255,.9)"/>
<g stroke="#8f3d12" stroke-width="1"><circle cx="176.1" cy="178.6" r="2.6"/><line x1="171.6" y1="178.6" x2="180.6" y2="178.6"/><line x1="176.1" y1="174.1" x2="176.1" y2="183.1"/></g>
</g>
<text x="191.0" y="196.1" font-family="Share Tech Mono, monospace" font-size="3.6" fill="#546881" text-anchor="end" stroke="none" letter-spacing=".5">ACTUAL SIZE · 225 MM WHEELBASE · PROPS 127 MM</text>
</g></svg></div>
</div>
</body></html>
